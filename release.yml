name: Build and publish Mafia Party release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm --filter @workspace/mafia-party run build:desktop:installer
      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path artifacts/mafia-party/release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          Copy-Item $installer.FullName artifacts/mafia-party/release/Mafia-Party-Setup.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mafia-party-windows
          path: artifacts/mafia-party/release/Mafia-Party-Setup.exe

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web assets for Android
        run: pnpm --filter @workspace/mafia-party run build:android
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable APK
        working-directory: artifacts/mafia-party/android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp artifacts/mafia-party/android/app/build/outputs/apk/debug/app-debug.apk artifacts/mafia-party/android/app/build/outputs/apk/debug/Mafia-Party.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafia-party-android
          path: artifacts/mafia-party/android/app/build/outputs/apk/debug/Mafia-Party.apk

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows-exe, android-apk]
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: mafia-party-windows
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: mafia-party-android
          path: release-assets
      - name: Publish release with both installers
        env:
          GH_TOKEN: \${{ github.token }}
          TAG: \${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/Mafia-Party-Setup.exe release-assets/Mafia-Party.apk \\
            --repo "$GITHUB_REPOSITORY" \\
            --target "$GITHUB_SHA" \\
            --title "Mafia Party $TAG" \\
            --generate-notes
